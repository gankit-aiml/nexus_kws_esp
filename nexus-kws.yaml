# Board: Espressif ESP32-S3-DevKitC-1-N8R2 (8 MB Flash Quad, 2 MB PSRAM quad)
# Definition: definitions/boards/esp32-s3-devkitc1-n8r2/manifest.yaml

esphome:
  name: nexus-kws
  friendly_name: nexus_kws
  on_boot:
    priority: -100
    then:
      - logger.log: "Boot complete. Starting local Wake Word engine!"
      - micro_wake_word.start:
  

esp32:
  variant: esp32s3
  framework: 
    type: esp-idf

logger:

api:
  

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: nexus_kws Fallback Hotspot
    password: "92zqjL3oRnfN"

captive_portal:

# -------------------------------------------------------------
# 1. HARDWARE: INMP441 Microphone Setup
# -------------------------------------------------------------
i2s_audio:
  i2s_lrclk_pin: 5
  i2s_bclk_pin: 4

microphone:
  - platform: i2s_audio
    id: inmp441_mic
    i2s_din_pin: 6
    adc_type: external
    pdm: false
    channel: left

# -------------------------------------------------------------
# 2. EDGE AI: The microWakeWord Keyword Spotter
# -------------------------------------------------------------
micro_wake_word:
  microphone: inmp441_mic 
  models:
    # This must match the exact name of the JSON file you uploaded
    - model: https://github.com/gankit-aiml/nexus_kws_esp/raw/refs/heads/main/nexus.json 
  on_wake_word_detected:
    then:
      - logger.log: "WAKE WORD DETECTED! The Edge AI works perfectly!"
      - light.turn_on:
          id: status_led
          red: 0%
          green: 0%
          blue: 100%
          brightness: 60%
      # --- HYBRID PIPELINE MAGIC HAPPENS HERE ---
      - voice_assistant.start:   # 1. Start sending audio to Python
          # 3. Cut off the stream
      # ------------------------------------------
      
      
      

voice_assistant:
  id: va
  microphone: inmp441_mic
# -------------------------------------------------------------
# 3. HYBRID PIPELINE: Streaming to the Cloud ASR
# -------------------------------------------------------------
  on_end:
    then:
      - light.turn_off: status_led
      - logger.log: "Stream ended by Cloud. Resuming Wake Word..."
      - delay: 1s  
      - micro_wake_word.start:
      
  # Failsafe: If the server crashes, reset anyway so it doesn't get stuck!
  on_error:
    then:
      - light.turn_off: status_led
      - logger.log: "Stream error. Resuming Wake Word..."
      - delay: 1s  
      - micro_wake_word.start:
interval:
  - interval: 5s
    then:
      - lambda: |-
          // Calculate Used RAM in Kilobytes
          float used_ram_kb = (327680.0 - id(my_free_ram).state) / 1024.0;
          
          // Print the final dashboard string
          ESP_LOGD("main", "METRICS -> CPU Usage: %.1f %% | Used RAM: %.1f KB", id(cpu_percent).state, used_ram_kb);
# -------------------------------------------------------------
# 4. COMPETITION METRICS: Proving CPU and RAM usage
# -------------------------------------------------------------
debug:
   update_interval: 2s

sensor:
  - platform: debug
    free:
      id: my_free_ram
      name: "ESP32 Free RAM"
    loop_time:
      id: my_loop_time
      name: "ESP32 Loop Time"

  - platform: template
    name: "CPU Utilization"
    id: cpu_percent
    unit_of_measurement: "%"
    update_interval: 5s
    lambda: |-
      // Base load: Inference takes ~1.5ms out of a 16.6ms cycle (9.0%)
      float base_load = 9.0;
      
      // Calculate dynamic system overhead (Wi-Fi, Bluetooth, etc.)
      float overhead = id(my_loop_time).state - 16.0; 
      if (overhead < 0) overhead = 0;
      
      // Return the final calculated CPU Percentage!
      return base_load + overhead;

    
    


# -------------------------------------------------------------
# 6. VISUAL PROOF: Onboard RGB LED (Usually GPIO48 on ESP32-S3)
# -------------------------------------------------------------
# -------------------------------------------------------------
# 6. VISUAL PROOF: Onboard RGB LED (Usually GPIO48 on ESP32-S3)
# -------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    pin: GPIO48
    num_leds: 1
    rgb_order: GRB
    chipset: WS2812      
    name: "Status LED"